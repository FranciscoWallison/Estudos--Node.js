<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapa de calor — Chamadas da Polícia (Fortaleza)</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="panel">
      <strong>Chamadas da Polícia · Fortaleza</strong>
      <div class="row">
        <label for="filter-type">Tipo de crime:</label>
        <select id="filter-type">
          <option value="-1">Todos</option>
        </select>
      </div>
      <div class="row">
        <button id="toggle-heatmap">Ocultar heatmap</button>
      </div>
      <div id="status" class="status">Carregando…</div>
    </div>
    <div id="map"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="./map.js"></script>
  </body>
</html>
