<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adolescentes e Jovens no Brasil — IBGE</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">📊 Adolescentes e Jovens no Brasil</span>
        <span class="navbar-text text-white-50 small">Fonte: IBGE</span>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <aside class="col-12 col-md-4 col-lg-3 sidebar border-end bg-light">
          <input
            id="search"
            class="form-control my-3"
            type="search"
            placeholder="Filtrar tabelas…"
          />
          <div id="menu" class="accordion accordion-flush mb-3"></div>
        </aside>

        <main class="col-12 col-md-8 col-lg-9 py-3">
          <div id="welcome" class="text-center text-muted py-5">
            <h5>Selecione uma tabela no menu à esquerda</h5>
            <p>Dados do IBGE sobre adolescentes e jovens (10 a 24 anos) no Brasil.</p>
          </div>

          <div id="content" class="d-none">
            <h4 id="table-title" class="mb-1"></h4>
            <p class="text-muted small mb-3" id="table-meta"></p>

            <div class="card mb-4">
              <div class="card-header d-flex align-items-center gap-2 flex-wrap">
                <strong class="me-2">Gráfico</strong>
                <label class="small text-muted mb-0">Linha:</label>
                <select id="chart-row" class="form-select form-select-sm" style="max-width: 340px"></select>
                <label class="small text-muted mb-0 ms-2">Tipo:</label>
                <select id="chart-type" class="form-select form-select-sm" style="max-width: 130px">
                  <option value="bar">Barras</option>
                  <option value="line">Linha</option>
                </select>
              </div>
              <div class="card-body">
                <canvas id="chart" height="110"></canvas>
                <div id="chart-empty" class="text-muted d-none">
                  Esta tabela não tem linhas numéricas para gerar gráfico.
                </div>
              </div>
            </div>

            <div id="tables"></div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.js"></script>
    <script src="main.js"></script>
  </body>
</html>
